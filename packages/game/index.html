<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Astral Barrage — Danmaku</title>
    <style>
      html, body { margin: 0; padding: 0; background: #05060f; color: #e8eaf6; font-family: 'Courier New', monospace; overflow: hidden; height: 100%; }
      #app { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; box-shadow: 0 0 40px rgba(80,120,255,0.25); }
      .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 10; }
      .overlay.active { pointer-events: auto; }
      .title { font-size: 42px; letter-spacing: 4px; text-shadow: 0 0 18px #7aa2ff; margin-bottom: 8px; }
      .subtitle { font-size: 14px; opacity: 0.8; margin-bottom: 24px; }
      .menu { display: flex; flex-direction: column; gap: 10px; }
      .btn { background: rgba(20,30,60,0.7); border: 1px solid #4a6aff; color: #e8eaf6; padding: 10px 28px; font-size: 16px; cursor: pointer; letter-spacing: 2px; }
      .btn:hover { background: rgba(60,90,180,0.8); }
      .btn.sel { background: rgba(90,130,255,0.9); }
      .hud { position: absolute; top: 8px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; font-size: 14px; z-index: 5; pointer-events: none; text-shadow: 0 0 6px #000; }
      .hud .timer { font-size: 22px; font-weight: bold; color: #ffe066; }
      .phase { position: absolute; top: 40px; left: 0; right: 0; text-align: center; font-size: 13px; opacity: 0.85; z-index: 5; pointer-events: none; text-shadow: 0 0 6px #000; }
      .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 36px; z-index: 6; pointer-events: none; text-shadow: 0 0 20px #fff; opacity: 0; transition: opacity 0.3s; }
      .msg.show { opacity: 1; }
      .credits { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 10px; opacity: 0.5; z-index: 5; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud" id="hud" style="display:none;">
      <div>LIVES <span id="lives">3</span> &nbsp; SCORE <span id="score">0</span></div>
      <div class="timer" id="timer">0:00</div>
    </div>
    <div class="phase" id="phase" style="display:none;"></div>
    <div class="msg" id="msg"></div>
    <div class="credits" id="credits" style="display:none;">Assets: procedural pixel art + engine by Gensokyo Danmaku Studio (MIT). See CREDITS.md</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
